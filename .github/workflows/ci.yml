name: CI
# CI runs locally (scripts/ci-local.sh) to save GitHub Actions minutes; this
# workflow only runs when started by hand.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - name: Verify CMake for default JPEG XL build
        run: cmake --version
      - name: Reject bundled neural weights
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if git ls-files | grep -iE '\.(mlmodelc|mlpackage|mlmodel|onnx|safetensors|pt|pth|ckpt)(/|$)|weight\.bin$|(^|/)(DenoiseModels|EnhancementModels|models)/'; then
            echo "Neural weights must be installed on demand, never committed"
            exit 1
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --workspace -- -D warnings
      - run: cargo test --workspace

  visual-regression:
    # macos-14 supplies a stable Apple GPU/WindowServer combination. The
    # committed full-window reference intentionally changes only via review.
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Capture deterministic SDR welcome window
        env:
          SHOPPHOTO_SDR: "1"
          SP_VISUAL_REGRESSION: "1"
          SP_SCREENSHOT: ${{ runner.temp }}/shopphoto-actual.png
        run: cargo run -p sp-app --bin shopphoto
      - name: Compare full-frame screenshot
        run: cargo run -p sp-app --bin visual_compare -- docs/research-2026-08-31/assets/ui-final-empty.png "${{ runner.temp }}/shopphoto-actual.png" 18.0 0.20
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-actual
          path: ${{ runner.temp }}/shopphoto-actual.png
