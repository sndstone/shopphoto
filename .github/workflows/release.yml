name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    env:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Import Apple signing certificate
        if: env.APPLE_CERTIFICATE_P12_BASE64 != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Configure notarization credentials
        if: env.APPLE_ID != ''
        run: |
          xcrun notarytool store-credentials SHOPPHOTO_CI --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "APPLE_NOTARY_PROFILE=SHOPPHOTO_CI" >> "$GITHUB_ENV"
      - name: Build universal app, sign, notarize, and package DMG
        env:
          SHOPPHOTO_VERSION: ${{ github.ref_name }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          export SHOPPHOTO_VERSION="${SHOPPHOTO_VERSION#v}"
          ./scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ShopPhoto-macOS
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build application
        run: cargo build -p sp-app --release --target x86_64-pc-windows-msvc
      - name: Install NSIS and build installer
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DVERSION=$version" packaging/windows/ShopPhoto.nsi
          New-Item -ItemType Directory -Force dist
          Move-Item "ShopPhoto-$version-Setup.exe" dist/
      - name: Sign Windows installer
        if: env.WINDOWS_CERTIFICATE_PFX_BASE64 != ''
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "shopphoto.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD (Get-ChildItem dist/*-Setup.exe).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: ShopPhoto-Windows
          path: dist/*-Setup.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GUI and AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libfuse2
          curl -L -o /usr/local/bin/appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Build AppImage
        env:
          SHOPPHOTO_VERSION: ${{ github.ref_name }}
        run: |
          export SHOPPHOTO_VERSION="${SHOPPHOTO_VERSION#v}"
          ./scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ShopPhoto-Linux
          path: dist/*.AppImage

  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
