[package]
name = "shopphoto-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3"
sp-raw = { path = "../crates/sp-raw" }

[[bin]]
name = "raw_decode"
path = "fuzz_targets/raw_decode.rs"
test = false
doc = false
bench = false

# The fuzz crate is its OWN workspace (the root excludes it), so it does not
# inherit the root's [patch.crates-io]. Without this it would fuzz the
# crates.io rawler while the app runs the vendored one — different code,
# different bugs, findings that do not apply.
[patch.crates-io]
rawler = { path = "../vendor/rawler" }
