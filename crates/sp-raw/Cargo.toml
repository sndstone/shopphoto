[package]
name = "sp-raw"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
native-codecs = ["dep:libheif-rs", "sp-core/native-codecs"]

[dependencies]
sp-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
rawler = "0.7"
rayon = "1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp"] }
moxcms = { version = "0.8.1", features = ["extended_range"] }
jxl-oxide = { version = "0.12.6", features = ["image"] }
kamadak-exif = "0.6.1"
libheif-rs = { version = "3.0.0", optional = true, default-features = false, features = ["v1_17"] }

[dev-dependencies]
tempfile = "3"
sp-export = { workspace = true }

[build-dependencies]
cc = "1"
