<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo proofs</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#151718;color:#eceeed}body{margin:0}header{padding:24px 5vw;position:sticky;top:0;background:#151718ed;z-index:1;border-bottom:1px solid #3c4241}h1{font-size:24px;margin:0 0 8px}p{color:#aeb9b5;font-size:14px}button,select{font:inherit;color:inherit;background:#29312e;border:1px solid #65766e;border-radius:7px;padding:9px 13px;cursor:pointer}button:hover{background:#3e5248}button:focus-visible,select:focus-visible{outline:3px solid #b7e3c9;outline-offset:3px}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}main{padding:24px 5vw;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px}article{background:#202523;border:1px solid #3c4841;border-radius:10px;overflow:hidden}article>button{display:block;padding:0;width:100%;border:0;border-radius:0;background:#111}img{display:block;max-width:100%}article img{width:100%;height:250px;object-fit:contain}.details{padding:15px}.name{font-weight:600;overflow-wrap:anywhere}.caption{white-space:pre-wrap}label{display:inline-flex;gap:9px;align-items:center;margin:8px 12px 0 0}input{width:20px;height:20px}dialog{width:95vw;height:95vh;max-width:1600px;background:#101211;color:inherit;border:1px solid #65766e;padding:12px}dialog::backdrop{background:#000e}dialog img{height:calc(100% - 90px);width:100%;object-fit:contain}dialog .actions{justify-content:center;padding:10px}.status{font-size:14px;color:#b8d7c7}#empty{padding:30px}
</style>
<header><h1 id="title">Photo proofs</h1><p>Select your favorites, then save your picks and return the downloaded file to the photographer. Choices stay in this browser when storage is available.</p><div class="actions"><button id="download">Save picks</button><button id="slideshow">Start slideshow</button><label><input type="checkbox" id="only">Show selected</label><span id="status" class="status" aria-live="polite"></span></div></header>
<main id="grid"></main><p id="empty" hidden>No selected photos yet.</p>
<dialog id="viewer" aria-label="Photo viewer"><img id="large" alt=""><div class="actions"><button id="prev" aria-label="Previous photo">← Previous</button><span id="position"></span><button id="next" aria-label="Next photo">Next →</button><button id="play">Pause slideshow</button><button id="close">Close</button></div></dialog>
<script>
'use strict';const data=/*PHOTO_DATA*/null;
document.title=data.title;document.getElementById('title').textContent=data.title;
const storageKey='shopphoto-proof-'+data.gallery_id;let restored={};try{restored=JSON.parse(localStorage.getItem(storageKey)||'{}')||{};}catch{}
const choices=data.photos.map(p=>({id:p.id,picked:restored[p.id]?.picked===true,rating:Number.isInteger(restored[p.id]?.rating)?Math.min(5,Math.max(0,restored[p.id].rating)):0}));
const grid=document.getElementById('grid'),only=document.getElementById('only'),viewer=document.getElementById('viewer');let current=0,timer=null;
function update(){try{localStorage.setItem(storageKey,JSON.stringify(choices));}catch{}document.getElementById('status').textContent=choices.filter(c=>c.picked).length+' of '+choices.length+' selected';for(const card of grid.children)card.hidden=only.checked&&!choices[Number(card.dataset.id)].picked;document.getElementById('empty').hidden=!only.checked||choices.some(c=>c.picked);}
function show(index){current=(index+data.photos.length)%data.photos.length;const p=data.photos[current];const large=document.getElementById('large');large.src=p.file;large.alt=p.caption||p.name;document.getElementById('position').textContent=(current+1)+' / '+data.photos.length+' · '+p.name;}
function pause(){clearInterval(timer);timer=null;document.getElementById('play').textContent='Play slideshow';}
function play(){pause();timer=setInterval(()=>show(current+1),4000);document.getElementById('play').textContent='Pause slideshow';}
for(const p of data.photos){const card=document.createElement('article');card.dataset.id=p.id;const open=document.createElement('button');open.setAttribute('aria-label','View '+p.name);const img=document.createElement('img');img.src=p.file;img.alt=p.caption||p.name;img.loading='lazy';open.append(img);open.onclick=()=>{show(p.id);pause();viewer.showModal();};const details=document.createElement('div');details.className='details';const name=document.createElement('div');name.className='name';name.textContent=p.name;const caption=document.createElement('p');caption.className='caption';caption.textContent=p.caption;const pickLabel=document.createElement('label'),pick=document.createElement('input');pick.type='checkbox';pick.checked=choices[p.id].picked;pick.onchange=()=>{choices[p.id].picked=pick.checked;update();};pickLabel.append(pick,document.createTextNode('Select'));const ratingLabel=document.createElement('label');ratingLabel.append(document.createTextNode('Rating'));const rating=document.createElement('select');for(let n=0;n<=5;n++){const option=document.createElement('option');option.value=n;option.textContent=n===0?'Unrated':n+' star'+(n===1?'':'s');rating.append(option);}rating.value=choices[p.id].rating;rating.onchange=()=>{choices[p.id].rating=Number(rating.value);update();};ratingLabel.append(rating);details.append(name,caption,pickLabel,ratingLabel);card.append(open,details);grid.append(card);}
only.onchange=update;document.getElementById('download').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,gallery_id:data.gallery_id,choices},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='photo-picks.sppicks';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
document.getElementById('slideshow').onclick=()=>{show(0);viewer.showModal();play();};document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.getElementById('play').onclick=()=>timer?pause():play();document.getElementById('close').onclick=()=>viewer.close();viewer.addEventListener('close',pause);viewer.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){show(current+1);e.preventDefault();}if(e.key==='ArrowLeft'){show(current-1);e.preventDefault();}if(e.key===' '&&e.target.tagName!=='BUTTON'){timer?pause():play();e.preventDefault();}});update();
</script></html>
